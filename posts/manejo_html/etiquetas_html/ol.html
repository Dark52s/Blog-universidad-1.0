<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta ol - Blog Paradigmas de Programacion</title>
    
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <script type="module" src="../../../index.js" data-depth="3"></script>
    <h1>&lt;ol&gt;</h1>

    <article>
        <p>
            La etiqueta <span class="code-inline">&lt;ol&gt;</span> define una lista ordenada (con números o letras).
        </p>
<pre><code>&lt;ol type="1"&gt;
  &lt;li&gt;Primer elemento&lt;/li&gt;
  &lt;li&gt;Segundo elemento&lt;/li&gt;
&lt;/ol&gt;</code></pre>
        <table>
            <thead>
                <tr>
                    <th>Atributo</th>
                    <th>Descripción</th>
                    <th>Ejemplo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="code-inline">type</span></td>
                    <td>Estilo de numeración (1, A, a, I, i)</td>
                    <td><span class="code-inline">type="A"</span></td>
                </tr>
                <tr>
                    <td><span class="code-inline">start</span></td>
                    <td>Número inicial</td>
                    <td><span class="code-inline">start="5"</span></td>
                </tr>
            </tbody>
        </table>

        <p><a href="../manejo-html.html">← Volver a la lista de etiquetas</a></p>
    </article>
</body>

</html>
