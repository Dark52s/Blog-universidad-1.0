<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta hr - Blog Paradigmas de Programacion</title>
    
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <script src="../../../index.js" data-depth="3"></script>
    <h1>&lt;hr&gt;</h1>

    <article>
        <p>
            La etiqueta <span class="code-inline">&lt;hr&gt;</span> crea un separador temático horizontal. Es una etiqueta vacía.
        </p>
<pre><code>&lt;p&gt;Primera sección&lt;/p&gt;
&lt;hr&gt;
&lt;p&gt;Segunda sección&lt;/p&gt;</code></pre>
        <table>
            <thead>
                <tr>
                    <th>Atributo</th>
                    <th>Descripción</th>
                    <th>Ejemplo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="code-inline">color</span></td>
                    <td>Color de la línea</td>
                    <td><span class="code-inline">color="red"</span></td>
                </tr>
                <tr>
                    <td><span class="code-inline">width</span></td>
                    <td>Ancho de la línea</td>
                    <td><span class="code-inline">width="50%"</span></td>
                </tr>
            </tbody>
        </table>

        <p><a href="../manejo-html.html">← Volver a la lista de etiquetas</a></p>
    </article>
</body>

</html>
