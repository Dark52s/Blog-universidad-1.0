<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etiqueta ul - Blog Paradigmas de Programacion</title>
    
    <link rel="stylesheet" href="../../../style.css">
</head>

<body>
    <script type="module" src="../../../index.js" data-depth="3"></script>
    <h1>&lt;ul&gt;</h1>

    <article>
        <p>
            La etiqueta <span class="code-inline">&lt;ul&gt;</span> define una lista desordenada (con viñetas).
        </p>
<pre><code>&lt;ul&gt;
  &lt;li&gt;Manzana&lt;/li&gt;
  &lt;li&gt;Naranja&lt;/li&gt;
&lt;/ul&gt;</code></pre>

        <p><em>Esta etiqueta acepta atributos específicos.</em></p>
        <table>
            <thead>
                <tr>
                    <th>Atributo</th>
                    <th>Descripción</th>
                    <th>Ejemplo</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><span class="code-inline">type</span></td>
                    <td>Tipo de viñeta: disc, circle, square</td>
                    <td><span class="code-inline">type="square"</span></td>
                </tr>
            </tbody>
        </table>
        <p><a href="../manejo-html.html">← Volver a la lista de etiquetas</a></p>
    </article>
</body>

</html>
