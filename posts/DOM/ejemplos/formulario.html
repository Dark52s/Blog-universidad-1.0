<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo: Formulario</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #121212;
            font-family: 'Open Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #e2e8f0;
        }
        .contenedor {
            text-align: center;
            padding: 20px;
        }
        select, button {
            background: #1f1f1f;
            color: #e2e8f0;
            border: 2px solid #444;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        select:hover, button:hover {
            border-color: #0ceca5;
        }
        #vista {
            width: 200px;
            height: 100px;
            background: #444;
            border-radius: 8px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .info {
            margin-top: 15px;
            color: #bdc1c6;
            font-size: 14px;
        }
        .info span {
            color: #0ceca5;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <label for="color">Color:</label>
        <select id="color">
            <option value="#444">Ninguno</option>
            <option value="#ff4444">Rojo</option>
            <option value="#0ceca5">Verde</option>
            <option value="#4488ff">Azul</option>
        </select>

        <div id="vista">Vista previa</div>

        <form id="form-color">
            <button>Guardar</button>
        </form>

        <p id="estado" class="info">Selecciona un color y presiona Guardar</p>
    </div>

    <script>
        let s = document.getElementById("color");
        let v = document.getElementById("vista");
        let f = document.getElementById("form-color");
        let estado = document.getElementById("estado");

        s.addEventListener("change", () => {
            v.style.background = s.value;
            estado.textContent = "Color seleccionado";
        });

        f.addEventListener("submit", (ev) => {
            ev.preventDefault();
            estado.textContent = "Guardado!";
            estado.style.color = "#0ceca5";
            
        });
    </script>
</body>
</html>
