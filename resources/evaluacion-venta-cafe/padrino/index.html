<!DOCTYPE html>
<html lang="es">

<head>
  
  <meta charset="UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Sistema de Gestión de Café</title>
  
  <link rel="stylesheet" href="style.css">
  
</head>

<body>

  <header style="margin: 0; padding: 0;">
    
    <h1 style="margin: 0; padding: 15px 0; font-family: sans-serif; text-align: center; color: white;">
    Sistema de Gestión de Café</h1>
    
  </header>
  
    <div style="background: #4e342e; padding: 10px; text-align: center;">
    
    <button type="button" onclick="verseccion('modulo-proveedor')">Proveedores</button>
    
    <button type="button" onclick="verseccion('modulo-cliente')">Clientes</button>
    
    <button type="button" onclick="verseccion('modulo-cafe')">Compra/Venta</button>
    
    <button type="button" onclick="verseccion('modulo-reportes')">Reportes</button>
    
</div>
  
  <div id="modulo-cafe">
  
  <main id="contenedor-principal">
    
      <div class="tarjeta">
    
    <h2 class="seccion-titulo">Registrar Nuevo Lote</h2>

<div class="input-group">
  
    <label class="input-label">Nombre del Producto</label>
    
    <input type="text" id="<cafe-nombre></cafe-nombre>" class="input-field" placeholder="ej: café arábica">
    
</div>

<div class="input-group">
    
    <label>Tipo de Café:</label>
<select id="cafe-tipo" required>
    
    <option value="">-- Seleccione una modalidad --</option>
    
    <option value="Suave">Suave</option>
    
    <option value="Normal">Normal</option>
    
    <option value="Fuerte">Fuerte</option>
    
</select>

    <label class="input-label">Cantidad (Kg)</label>
    
    <input type="number" id="cafe-cantidad" class="input-field" placeholder="ej: 50">
    
</div>

<button type="button" id="btn-guardar-lote" class="btn-guardar">Guardar Lote</button>

<div id="mensaje-exito" class="mensaje-exito">
    ¡Lote registrado con éxito!
    
</div>

</div>

</div>

    <div id="modulo-proveedor" style="margin-top: 50px; margin-bottom: 50px; display: none;">
        
        <div class="tarjeta">
            
            <h2 style="color: #4a3429; text-align: center; margin-bottom: 20px; font-family: sans-serif;">
                
                Registrar Nuevo Proveedor
                
            </h2>
            
            <div class="input-group">
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #4a3429;">
                    
                    Nombre o Razón Social:
                    
                </label>
                
                <input type="text" id="proveedor-nombre" placeholder="Ej. Distribuidora Café El Llano" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
            </div>
            
            <div class="input-group" style="margin-top: 15px;">
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #4a3429;">
                    
                    RIF:
                    
                </label>
                
                <input type="text" id="proveedor-rif" placeholder="Ej. J-12345678-9" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                
            </div>
            
            <div class="input-group" style="margin-top: 15px;">
                
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #4a3429;">
                    
                    Teléfono de Contacto:
                    
                </label>
                
                <input type="tel" id="proveedor-telefono" placeholder="Ej. 0412-1234567" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
                
            </div>
            
            <button type="button" class="btn-guardar" id="btn-guardar-proveedor" style="margin-top: 25px;">
                
                Guardar Proveedor
                
            </button>
            
        </div>
        
    </div>
    
    <div id="modulo-cliente" style="display: none;">
        
    <h2>Registrar Cliente</h2>
    
    <form>
        
        <label>Nombre:</label>
        
        <input type="text" id="cliente-nombre">
        
        <label>Cédula / RIF:</label>
        
        <input type="text" id="cliente-cedula">
        
        <label>Teléfono:</label>
        
        <input type="text" id="cliente-telefono">
        
        <button type="button" id="btn-guardar-cliente">Guardar Cliente</button>
        
    </form>
    
</div>

<script src="app.js"></script>

<script>
    document.getElementById('btn-guardar').addEventListener('click', function() {
        var guardadoExitoso = true;
        
        if (guardadoExitoso) {
            var mensaje = document.getElementById('mensaje-exito');
            
            mensaje.style.display = 'block';
            
            setTimeout(function() {
                mensaje.style.display = 'none';
                
            }, 3000);
            
        }
        
    });
    
</script>

</body>

</html>
